spring.application.name=campus-smart-parking
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_parking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
parking.ebike-flat-fee=${EBIKE_FLAT_FEE:15}
parking.floor-slots=8,10,12,10,8